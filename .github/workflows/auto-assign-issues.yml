name: Auto Assign Issues

on:
  issues:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Assign issue to creator and hist0613
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueCreator = context.payload.issue.user.login;
            const targetUser = 'hist0613';

            // Create a set to avoid duplicate assignments
            const assignees = new Set([issueCreator]);

            // Add hist0613 if not already the creator
            if (issueCreator !== targetUser) {
              assignees.add(targetUser);
            }

            // Assign the issue
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: Array.from(assignees)
            });

            console.log(`✅ Assigned issue #${context.payload.issue.number} to: ${Array.from(assignees).join(', ')}`);
