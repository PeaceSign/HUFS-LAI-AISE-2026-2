name: "Check PR Approvals"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check-approvals:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read

    if: github.event_name != 'pull_request_review' || github.event.review.state != 'commented'

    steps:
      - name: Verify Approvals
        uses: actions/github-script@v7
        with:
          script: |
            // merge 요건은 approval 1개 이상. 누가 남겼는지는 따지지 않는다.
            const REQUIRED_APPROVALS = 1;

            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // 한 사람이 여러 번 리뷰했으면 마지막 상태만 본다.
            // 단 COMMENTED는 approval을 취소하지 않으므로(GitHub 자체 판정과 동일)
            // 상태 갱신에서 제외한다. approve 후 인라인 코멘트를 남기면
            // 그 approval이 사라지던 문제를 막는다.
            const latestReviews = {};
            reviews.forEach(r => {
              if (r.state === 'COMMENTED') {
                return;
              }
              latestReviews[r.user.login] = r.state;
            });

            const approvers = Object.keys(latestReviews).filter(
              user => latestReviews[user] === 'APPROVED'
            );

            console.log(`Approvals: ${approvers.length}/${REQUIRED_APPROVALS} (${approvers.join(', ') || 'none'})`);

            if (approvers.length >= REQUIRED_APPROVALS) {
              console.log('All approval conditions met!');
              return;
            }

            const message = `approval이 ${REQUIRED_APPROVALS}개 이상 필요합니다 (현재 ${approvers.length}개)`;

            // 리뷰가 실제로 제출된 시점에만 실패로 처리한다.
            // PR이 열리거나 갱신된 시점에는 상태만 남긴다.
            if (context.eventName === 'pull_request_review') {
              core.setFailed(message);
            } else {
              console.log(message);
            }
